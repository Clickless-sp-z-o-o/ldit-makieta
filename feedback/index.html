<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback do makiety LDIT</title>
<style>
:root { --granat: #222344; --granat-2: #2f3160; --zloto: #cdad7d; --zloto-tlo: #f6f0e6; --tlo: #f4f5f9; --karta: #fff;
  --tekst: #1f2133; --szary: #6b6f87; --linia: #e3e5ee; --ok: #18a558; --uwaga: #c98a12; --zle: #e84040; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: Inter, "Segoe UI", system-ui, sans-serif; font-size: 14px; color: var(--tekst); background: var(--tlo); }
button, textarea, input { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
.menu { background: var(--granat); color: #e8e9f3; overflow-y: auto; padding: 16px 0 24px; }
.logo { padding: 0 20px 14px; border-bottom: 1px solid rgba(255,255,255,.1); margin-bottom: 8px; }
.logo b { color: var(--zloto); font-size: 18px; letter-spacing: .5px; }
.logo span { display: block; font-size: 12px; opacity: .7; margin-top: 2px; }
.sekcja-menu { margin-top: 6px; }
.sekcja-menu > button { width: 100%; text-align: left; background: none; border: 0; padding: 9px 20px; cursor: pointer;
  font-weight: 600; color: #fff; display: flex; justify-content: space-between; gap: 8px; }
.sekcja-menu > button:hover { background: var(--granat-2); }
.sekcja-menu .licznik { font-size: 11px; font-weight: 500; opacity: .75; white-space: nowrap; }
.sekcja-menu ol { list-style: none; margin: 0; padding: 0 0 4px; }
.sekcja-menu li button { width: 100%; text-align: left; background: none; border: 0; padding: 6px 20px 6px 32px; cursor: pointer;
  color: #c9cbe0; font-size: 13px; display: flex; gap: 8px; align-items: flex-start; }
.sekcja-menu li button:hover { background: var(--granat-2); color: #fff; }
.aktywny { background: var(--granat-2) !important; color: #fff !important; box-shadow: inset 3px 0 0 var(--zloto); }
.kropka { flex: none; width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; border: 1.5px solid #8a8db0; }
.kropka.pelna { background: var(--zloto); border-color: var(--zloto); }
.glowna { display: flex; flex-direction: column; min-width: 0; }
.pasek { display: flex; align-items: center; gap: 14px; padding: 10px 24px; background: var(--karta); border-bottom: 1px solid var(--linia); flex-wrap: wrap; }
.pasek h1 { font-size: 16px; margin: 0; }
.postep { flex: 1; min-width: 180px; }
.postep small { color: var(--szary); }
.postep .tor { height: 6px; background: var(--linia); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.postep .tor div { height: 100%; background: var(--zloto); width: 0; transition: width .3s; }
.btn { border: 1px solid var(--linia); background: var(--karta); border-radius: 8px; padding: 7px 14px; cursor: pointer; }
.btn:hover { border-color: var(--granat); }
.btn.glowny { background: var(--granat); color: #fff; border-color: var(--granat); }
.btn.glowny:hover { background: var(--granat-2); }
.btn:disabled { opacity: .4; cursor: default; }
.tresc { flex: 1; overflow-y: auto; padding: 24px; }
.karta { background: var(--karta); border: 1px solid var(--linia); border-radius: 12px; padding: 22px; max-width: 1200px; margin: 0 auto 18px; }
.okruszek { color: var(--szary); font-size: 12px; margin-bottom: 6px; }
.karta h2 { margin: 0 0 14px; font-size: 20px; }
.zrzut { display: block; width: 100%; border: 1px solid var(--linia); border-radius: 8px; cursor: zoom-in; background: #fafbfd; }
.podpowiedz { color: var(--szary); font-size: 12px; margin: 6px 0 0; }
.opis-ekranu { margin: -6px 0 14px; color: var(--szary); max-width: 900px; line-height: 1.5; }
.pytanie { margin-top: 20px; }
.pytanie h3 { margin: 0 0 10px; font-size: 15px; }
.oceny { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.oceny label { border: 1px solid var(--linia); border-radius: 20px; padding: 6px 14px; cursor: pointer; user-select: none; }
.oceny input { position: absolute; opacity: 0; pointer-events: none; }
.oceny input:checked + span { font-weight: 600; }
.oceny label:has(input:checked) { border-color: var(--granat); background: var(--zloto-tlo); }
.oceny label:has(input:focus-visible) { outline: 2px solid var(--zloto); }
textarea { width: 100%; min-height: 110px; border: 1px solid var(--linia); border-radius: 8px; padding: 10px 12px; resize: vertical; }
textarea:focus, input[type=text]:focus { outline: 2px solid var(--zloto); border-color: var(--granat); }
input[type=text] { border: 1px solid var(--linia); border-radius: 8px; padding: 8px 12px; width: 100%; max-width: 420px; }
.nawigacja { display: flex; justify-content: space-between; gap: 10px; max-width: 1200px; margin: 0 auto; }
.wstep p { line-height: 1.6; max-width: 760px; }
.siatka { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-top: 14px; }
.miniatura { border: 1px solid var(--linia); border-radius: 8px; overflow: hidden; cursor: pointer; background: #fff; text-align: left; padding: 0; }
.miniatura img { display: block; width: 100%; height: 110px; object-fit: cover; object-position: top; }
.miniatura span { display: block; padding: 6px 8px; font-size: 12px; }
.podsumowanie td, .podsumowanie th { padding: 6px 12px; border-bottom: 1px solid var(--linia); text-align: left; }
.zapisano { color: var(--ok); font-size: 12px; min-width: 120px; }
.lightbox { position: fixed; inset: 0; background: rgba(20,21,40,.92); display: none; align-items: flex-start; justify-content: center;
  overflow: auto; z-index: 50; padding: 30px; cursor: zoom-out; }
.lightbox.otwarty { display: flex; }
.lightbox img { max-width: none; width: auto; max-width: 96vw; border-radius: 6px; }
@media (max-width: 860px) { .app { grid-template-columns: 1fr; } .menu { display: none; } .menu.otwarte { display: block; position: fixed; inset: 0; z-index: 40; } .tylko-telefon { display: inline-block !important; } }
.tylko-telefon { display: none; }
</style>
</head>
<body>
<div class="app">
  <nav class="menu" id="menu" aria-label="Sekcje ankiety"></nav>
  <div class="glowna">
    <header class="pasek">
      <button class="btn tylko-telefon" id="przyciskMenu" type="button">Menu</button>
      <h1>Feedback do makiety LDIT</h1>
      <div class="postep"><small id="postepTekst"></small><div class="tor"><div id="postepPasek"></div></div></div>
      <span class="zapisano" id="zapisano" aria-live="polite"></span>
      <button class="btn" id="wczytaj" type="button">Wczytaj JSON</button>
      <button class="btn glowny" id="zapisz" type="button">Zapisz odpowiedzi (JSON)</button>
      <input type="file" id="plik" accept="application/json,.json" hidden>
    </header>
    <main class="tresc" id="tresc" tabindex="-1"></main>
  </div>
</div>
<div class="lightbox" id="lightbox" role="dialog" aria-label="Powiększony zrzut"><img alt=""></div>
<script>
"use strict";
const DANE = {"wersja":"2026-10-21","sekcje":[{"nazwa":"Praca operacyjna","opis":"Codzienna praca LDIT: dashboard, wnioski, baza klientów, nabory, zadania, formularze i akceptacje.","ekrany":[{"id":"dash","tytul":"Dashboard","opis":"Zakładka Przegląd: kafelki operacyjne i finansowe, lista Na teraz (formularze i zmiany do akceptacji, powiadomienia, szkolenia w ciągu 8 dni, faktury po terminie, projekty nierozliczone), moje zadania do wykonania, planowane nabory po dniu rozpoczęcia, statusy wniosków i skuteczność pracowników liczona kwotą przyznaną (D-324, D-325).","plik":"screeny/dash.jpg","obraz":"screeny/dash.jpg"},{"id":"statystyki","tytul":"Skuteczność i lejki","opis":"Druga zakładka Dashboardu: projekty, skuteczność, przyznane dofinansowania, wnioski w miesiącach, lejek osób, skuteczność wg wielkości firmy, najczęstsze urzędy, kontrola kompletności danych, najpopularniejsze szkolenia i widok instytucji. Filtr instytucji i rok.","plik":"screeny/statystyki.jpg","obraz":"screeny/statystyki.jpg"},{"id":"wnioski","tytul":"Lista wniosków (Dofinansowania)","opis":"Lista wniosków roku w układzie Excela LDIT (D-342): Szczegóły i Historia w pierwszej kolumnie, potem Nr, Klient (nazwa skrócona, pełna w dymku), Instytucja, Wykonawca, Kontakt, E-mail, Urząd, Osób, Wartość, Status, Przyznano, Koszt całk., Osób z dof., Rozl., Dokumenty, Przygotował, Opiekunowie (imiona, D-344). Pionowe linie, wyśrodkowane komórki, kolory statusów z Excela. Status zmienia się listą po kliknięciu znacznika. Wyszukiwanie przyciskiem Wyszukaj (D-298), Ustaw kolejność, Usunięte z listy, eksport, bez przycisku Usuń.","plik":"screeny/wnioski.jpg","obraz":"screeny/wnioski.jpg"},{"id":"wnioski-historia","tytul":"Lista wniosków, panel Historia","opis":"Przycisk Historia otwiera nad tabelą przebieg wniosku od najstarszego zdarzenia (D-343): daty z wniosku, zmiany statusu z etapem, wpisy przebiegu z wykonawcą, zadania z terminem, maile klienta i maile wysłane z systemu, prośba o usunięcie. Każda pozycja ma datę, rodzaj i osobę. Z panelu przejście do pełnego przebiegu na karcie wniosku.","plik":"screeny/wnioski-historia.jpg","obraz":"screeny/wnioski-historia.jpg"},{"id":"karta-wniosku","tytul":"Karta wniosku (projektu)","opis":"Dane wpisywane ręcznie, potem wyliczenia KFS w kolejności obliczeń (D-305). Szkolenia projektu z terminem od i do, ceną i wyborem uczestników z listy jak filtr w Excelu; to samo szkolenie może być kilka razy jako grupy, a termin trafia do kalendarza (D-345). Uczestnik jest raz, z listą swoich szkoleń, kwalifikacją i sumą kwot. Dane projektu z polami Szkolenie od i do, dokumenty z Wystaw certyfikaty, osoby kontaktowe, przebieg z zadaniem z terminem i wpisem z wykonawcą, prowizja dla administratora, korespondencja i notatki. Administrator ma przycisk Usuń wniosek (D-346).","plik":"screeny/karta-wniosku.jpg","obraz":"screeny/karta-wniosku.jpg"},{"id":"wniosek-usuniecie","tytul":"Karta wniosku, prośba o usunięcie","opis":"Wniosek, o którego usunięcie poprosił pracownik LDIT. Administrator widzi baner z osobą, datą i powodem oraz przyciski Zatwierdź usunięcie i Odrzuć. Pracownik ma tylko Poproś o usunięcie z polem powodu, instytucje tej funkcji nie widzą. Usunięcie jest miękkie, wniosek można przywrócić w Usunięte z listy (D-346, D-261).","plik":"screeny/wniosek-usuniecie.jpg","obraz":"screeny/wniosek-usuniecie.jpg"},{"id":"baza","tytul":"Baza danych (lista klientów)","opis":"Klienci, jeden klient to jeden wiersz rozwijany do wniosków, nazwa skrócona z pełną w dymku (D-341). Domyślnie klienci przed złożeniem wniosku, filtr Z wnioskiem aktywnym zaznacza Czekamy i Pozytywna bez rozliczonych (D-367), liczniki naborów, wyszukiwanie przyciskiem Wyszukaj (D-298). Wstecz z edycji klienta wraca do listy z filtrami. Pracownik widzi tylko przypisanych klientów (D-299). Nowy klient (przy NIP atrapa przycisku GUS), import klienta z pliku eksportu do innej instytucji (D-282), eksport.","plik":"screeny/baza.jpg","obraz":"screeny/baza.jpg"},{"id":"karta-klienta","tytul":"Karta klienta","opis":"W nagłówku nazwa skrócona, obok pełna. Pełne dane firmy z nazwą skróconą, zobowiązania jako TAK albo NIE z odpowiedzią o ugodzie (D-340), w edycji Pobierz dane z GUS przy NIP (D-339). Pula uczestników z zatrudnieniem od - do i stanowiskiem (D-368), urzędy pracy klienta, wnioski, notatki z autorem i datą (D-284), korespondencja. Przyciski Złóż wniosek, Eksportuj do pliku (D-282) i Edytuj dane.","plik":"screeny/karta-klienta.jpg","obraz":"screeny/karta-klienta.jpg"},{"id":"nabory","tytul":"Nabory w urzędach pracy","opis":"Nabory ogłoszone i prognozowane wczytywane z pliku, w aplikacji pobierane z arkusza Google jako zrzuty z datą (D-333). Filtr Zrzut z dnia, Cofnij ostatnie wczytanie (D-301). Urząd dopasowany po nazwie albo aliasie, nieznany trafia do powiadomień (D-272). Oś 14 dni.","plik":"screeny/nabory.jpg","obraz":"screeny/nabory.jpg"},{"id":"nabory-klienci","tytul":"Nabory, Pokaż klientów","opis":"Klienci urzędu, także ci, dla których to dodatkowy urząd (D-358), z datami naboru, osobą kontaktową, telefonem, e-mailem, przejściem do karty i notatką (D-266). Pracownik widzi tylko przypisanych klientów (D-299).","plik":"screeny/nabory-klienci.jpg","obraz":"screeny/nabory-klienci.jpg"},{"id":"zadania","tytul":"Zadania i powiadomienia","opis":"Kafelki Zadania na dziś, Zaległe i Formularze do akceptacji, kalendarz zadań (miesiąc, tydzień, dzień), karty Na dziś, Wszystkie do zrobienia, Zaplanowane i Historia. Administrator przepisuje zadanie przyciskiem Przepisz (D-348). Obok powiadomienia: formularze czekające na akceptację i powiadomienia systemu (mail do przypisania, nieznany urząd, D-286, D-297).","plik":"screeny/zadania.jpg","obraz":"screeny/zadania.jpg"},{"id":"zadania-nowe","tytul":"Zadania, nowe zadanie","opis":"Formularz nowego zadania: tytuł, opis, wniosek opcjonalnie z pozycją bez wniosku (zadanie ogólne), osoba z zespołu LDIT, dzień wykonania (domyślnie dziś, przypomnienie to zadanie na dzień, D-348) i pole Przypomnij (dni przed terminem). Każdy pracownik może dodać zadanie innej osobie.","plik":"screeny/zadania-nowe.jpg","obraz":"screeny/zadania-nowe.jpg"},{"id":"nowy-formularz","tytul":"Nowy formularz, formularz klienta","opis":"Formularz w układzie formularza LDIT z Excela (D-338): sekcje z granatowymi paskami, dane firmy wierszami, uczestnicy w jednej tabeli z osobą w wierszu (rodzaj zatrudnienia, zatrudnienie od - do, stanowisko, D-368). Instytucja i sposób wprowadzenia w sekcji Zgłoszenie, nazwa skrócona pod nazwą firmy, Pobierz dane z GUS przy NIP (D-339), zobowiązania jako dwa pytania TAK/NIE (D-340). Ręcznie albo z pliku CSV lub Excel, pusty formularz do pobrania, lista Moje wysłane formularze.","plik":"screeny/nowy-formularz.jpg","obraz":"screeny/nowy-formularz.jpg"},{"id":"nowy-projekt","tytul":"Nowy formularz, nowy projekt","opis":"Jedyne miejsce zakładania projektu (D-304): klient, rok, urząd, instytucja, wykonawca, wartość, status, Przygotował i Opiekunowie z listy kont LDIT (D-329), szkolenia z ceną. Uczestnicy z puli klienta w tabeli osoba x szkolenie: jedna osoba może iść na kilka szkoleń naraz (D-369), przyciski Zaznacz wszystkich uczestników klienta i Odznacz wszystkich oraz licznik (D-347).","plik":"screeny/nowy-projekt.jpg","obraz":"screeny/nowy-projekt.jpg"},{"id":"akcept-formularze","tytul":"Do akceptacji, formularze","opis":"Przypomnienie o zgłoszeniach czekających dłużej niż dzień (D-332). Sekcja Prośby o usunięcie wniosku dla administratora z Zatwierdź usunięcie i Odrzuć (D-346). Kolejka formularzy z panelem w układzie formularza (sekcje z wierszami Pole i Wartość, nazwa skrócona, zobowiązania TAK/NIE, uczestnicy z Lp., rodzajem zatrudnienia, zatrudnieniem od - do i stanowiskiem, D-368), poprawa NIP, edycja, akceptacja z założeniem klienta i projektu, odrzucenie z powodem.","plik":"screeny/akcept-formularze.jpg","obraz":"screeny/akcept-formularze.jpg"},{"id":"akcept-zmiany","tytul":"Do akceptacji, zmiany danych od instytucji","opis":"Zmiany danych zgłoszone przez instytucje, także nazwy skróconej klienta i katalogu szkoleń: przed i po, zatwierdzenie albo odrzucenie z powodem (D-224, D-320). Zmiany danych instytucji i katalogu zatwierdza tylko administrator (D-330).","plik":"screeny/akcept-zmiany.jpg","obraz":"screeny/akcept-zmiany.jpg"}]},{"nazwa":"Konfiguracja","opis":"Instytucje szkoleniowe z katalogiem i warunkami oraz komunikacja mailowa.","ekrany":[{"id":"inst-przeglad","tytul":"Instytucje, przegląd","opis":"Kafelki instytucji w ich kolorach, tych samych co w kalendarzu i Dofinansowaniach (D-308). Instytucja z wyłączonymi automatycznymi powiadomieniami ma znacznik bez powiadomień. Kliknięcie kafelka otwiera konfigurację instytucji z zakładkami. Nowa instytucja i eksport.","plik":"screeny/inst-przeglad.jpg","obraz":"screeny/inst-przeglad.jpg"},{"id":"inst-dane","tytul":"Konfiguracja instytucji, konto instytucji","opis":"Konfiguracja jednej instytucji, wszystkie zakładki w jednym miejscu (D-309). Konto instytucji: dane, standard godzinowy szkoleń (D-335), osoby kontaktowe, opiekunowie instytucji (D-274), model terminów, stan automatycznych powiadomień. Karta Komunikacja z instytucją z przełącznikiem Wysyłaj automatyczne powiadomienia do instytucji, przełącza tylko administrator (D-350).","plik":"screeny/inst-dane.jpg","obraz":"screeny/inst-dane.jpg"},{"id":"inst-programy","tytul":"Konfiguracja instytucji, programy","opis":"Jeden katalog szkoleń instytucji bez podziału na lata (D-360), programy z cennikiem (kilka cen do wyboru we wniosku, D-277). Karta planu otwiera się w osobnym widoku.","plik":"screeny/inst-programy.jpg","obraz":"screeny/inst-programy.jpg"},{"id":"inst-karta-planu","tytul":"Konfiguracja instytucji, karta planu z cennikiem","opis":"Karta planu szkolenia w osobnym widoku, z powrotem do programów: program, efekty, pliki planu i cennik, czyli ceny po średniku do wyboru we wniosku (D-277, D-278).","plik":"screeny/inst-karta-planu.jpg","obraz":"screeny/inst-karta-planu.jpg"},{"id":"inst-osoby","tytul":"Konfiguracja instytucji, osoby i konta","opis":"Konta instytucji i ich role: administrator instytucji i handlowiec, bez trzeciej roli (D-354). Handlowiec widzi tylko swoich klientów i nie widzi innych handlowców.","plik":"screeny/inst-osoby.jpg","obraz":"screeny/inst-osoby.jpg"},{"id":"inst-koresp","tytul":"Konfiguracja instytucji, korespondencja","opis":"Korespondencja z instytucją.","plik":"screeny/inst-koresp.jpg","obraz":"screeny/inst-koresp.jpg"},{"id":"konf-warunki","tytul":"Konfiguracja instytucji, warunki prowizyjne","opis":"Zakładka administratora w konfiguracji instytucji: warunki prowizyjne z wersjami, widoczne tylko dla administratora (D-07).","plik":"screeny/konf-warunki.jpg","obraz":"screeny/konf-warunki.jpg"},{"id":"konf-certyfikat","tytul":"Konfiguracja instytucji, wzór certyfikatu","opis":"Wzór certyfikatu instytucji, z którego LDIT generuje certyfikaty uczestników. Instytucja certyfikatów nie pobiera (D-352).","plik":"screeny/konf-certyfikat.jpg","obraz":"screeny/konf-certyfikat.jpg"},{"id":"konf-faktura","tytul":"Konfiguracja instytucji, dane do faktury","opis":"Dane instytucji do faktury.","plik":"screeny/konf-faktura.jpg","obraz":"screeny/konf-faktura.jpg"},{"id":"konf-formularz","tytul":"Konfiguracja instytucji, formularz zgłoszeniowy","opis":"Ustawienia formularza zgłoszeniowego instytucji. Jeden formularz LDIT dla wszystkich instytucji, osobny import PDF tylko dla jednej (D-338, D-355).","plik":"screeny/konf-formularz.jpg","obraz":"screeny/konf-formularz.jpg"},{"id":"kalkulator","tytul":"Kalkulator prowizji","opis":"Kalkulator prowizji z przypadkami testowymi, tylko administrator. Metodologia do omówienia na osobnym spotkaniu na liczbach klientów (P-64).","plik":"screeny/kalkulator.jpg","obraz":"screeny/kalkulator.jpg"},{"id":"maile-szablony","tytul":"Komunikacja, biblioteka szablonów","opis":"Szablony maili LDIT z odbiorcą, autorem i licznikiem użyć, podgląd ze zmiennymi w nawiasach klamrowych. Odbiorcą jest firma (wnioskodawca), instytucja albo zespół LDIT, nigdy uczestnik szkolenia (D-350). Przyciski + Nowy szablon, Edytuj, Wyślij.","plik":"screeny/maile-szablony.jpg","obraz":"screeny/maile-szablony.jpg"},{"id":"maile-edytor","tytul":"Komunikacja, edytor szablonu i zmienne","opis":"Edytor szablonu: nazwa, odbiorca, temat i treść. Wstaw zmienną otwiera listę danych z wyszukiwarką w grupach Klient, Wniosek i szkolenie, Kwoty wniosku (tylko z prawem do kwot), Instytucja i LDIT; zmienna wstawia się w miejscu kursora. Zmienna spoza listy blokuje zapis (D-350).","plik":"screeny/maile-edytor.jpg","obraz":"screeny/maile-edytor.jpg"},{"id":"maile-wysylka","tytul":"Komunikacja, wysyłka","opis":"Wysyłka seryjna w trzech krokach (D-350). Krok 1: szablon, kontekst (np. Szkolenie zakończone z datą, domyślnie 3 miesiące temu), adresaci z wyszukiwarką, Zaznacz i Odznacz wszystkich, nadawca wyliczany, podgląd szablonu. Mail idzie do firmy albo instytucji, nigdy do uczestników.","plik":"screeny/maile-wysylka.jpg","obraz":"screeny/maile-wysylka.jpg"},{"id":"maile-seria","tytul":"Komunikacja, podgląd i poprawki maili","opis":"Krok 2 wysyłki seryjnej: osobny, uzupełniony mail dla każdego adresata. Każdy można rozwinąć i poprawić temat i treść, przywrócić treść z szablonu albo wyłączyć z wysyłki; braki danych mają żółte oznaczenie. Krok 3 to potwierdzenie i jedna wysyłka, mail trafia do korespondencji klienta i rejestru (D-350).","plik":"screeny/maile-seria.jpg","obraz":"screeny/maile-seria.jpg"},{"id":"maile-automaty","tytul":"Komunikacja, automatyzacje i alerty","opis":"Katalog automatyzacji systemowych z trybem i stanem, Automatyczne maile do instytucji z najbliższymi wyzwoleniami (pominięte przy wyłączonych powiadomieniach, np. Instytucja Szkoleniowa Beta), prośba o ustalenie terminu per instytucja z linkiem zmień, alerty ręczne, z praca.gov.pl, o fakturze i 8 dni przed szkoleniem. Do uczestników system nic nie wysyła.","plik":"screeny/maile-automaty.jpg","obraz":"screeny/maile-automaty.jpg"}]},{"nazwa":"Zarządzanie","opis l zewnętrzny","opis":"Terminy szkoleń wspólne dla LDIT i instytucji.","ekrany":[{"id":"terminy-miesiac","tytul":"Terminy szkoleń, kalendarz miesięczny","opis":"Kafelek z firmą i wykonawcą, kolor instytucji, skrót +N przy więcej niż trzech szkoleniach (D-267). Terminy ustawione na karcie wniosku trafiają tu z uczestnikami projektu (D-345). Domyślnie terminy z wnioskiem, wolne terminy instytucji pod filtrem (D-316, D-334).","plik":"screeny/terminy-miesiac.jpg","obraz":"screeny/terminy-miesiac.jpg"},{"id":"terminy-tydzien","tytul":"Terminy szkoleń, widok tygodnia","opis":"Widok tygodniowy kalendarza (pomysł Aldony, D-267).","plik":"screeny/terminy-tydzien.jpg","obraz":"screeny/terminy-tydzien.jpg"},{"id":"terminy-lista","tytul":"Terminy szkoleń, lista terminów","opis":"Terminy szkoleń jako lista, z terminami pozycji szkoleń wniosków i wolnymi terminami instytucji pod filtrem.","plik":"screeny/terminy-lista.jpg","obraz":"screeny/terminy-lista.jpg"}]},{"nazwa":"Konto instytucji szkoleniowej","opis":"To, co widzi instytucja po zalogowaniu: panel z zakładkami jak u LDIT.","ekrany":[{"id":"is-dashboard","tytul":"Dashboard instytucji","opis":"Dashboard widziany przez instytucję: tylko własni klienci, bez stawek prowizji.","plik":"screeny/is-dashboard.jpg","obraz":"screeny/is-dashboard.jpg"},{"id":"is-panel","tytul":"Panel instytucji, klienci i projekty","opis":"Panel z kafelkami i zakładkami jak u LDIT (D-353): Klienci i projekty, Złożone wnioski, Uczestnicy, Terminy szkoleń, Konto instytucji, Katalog szkoleń, Zgłoszenia z czerwonym licznikiem. Klienci i projekty: własni klienci z filtrami statusu, terminem i realizacją, eksport (D-361), szczegóły projektu tylko do odczytu bez certyfikatów (D-352).","plik":"screeny/is-panel.jpg","obraz":"screeny/is-panel.jpg"},{"id":"is-zlozone","tytul":"Panel instytucji, złożone wnioski","opis":"Wnioski instytucji złożone do urzędu: klient, urząd, szkolenie, osoby, data złożenia, decyzja, wyszukiwanie i eksport.","plik":"screeny/is-zlozone.jpg","obraz":"screeny/is-zlozone.jpg"},{"id":"is-uczestnicy","tytul":"Panel instytucji, uczestnicy","opis":"Wszyscy uczestnicy wniosków instytucji: uczestnik, klient, projekt, szkolenie, termin i kwalifikacja, ze szczegółami, wyszukiwaniem i eksportem (D-319). Niezakwalifikowany w kolorze statusu negatywnego z plakietką i legendą (D-370). Handlowiec widzi tylko uczestników swoich klientów (D-354).","plik":"screeny/is-uczestnicy.jpg","obraz":"screeny/is-uczestnicy.jpg"},{"id":"is-terminy","tytul":"Panel instytucji, terminy szkoleń","opis":"Terminy instytucji jako lista: szkolenie, od, do, miejsce, status (wolny, zaplanowany, odbyty) i zapisani, z przyciskiem Kalendarz terminów. Handlowiec widzi tylko terminy wniosków swoich klientów.","plik":"screeny/is-terminy.jpg","obraz":"screeny/is-terminy.jpg"},{"id":"is-konto","tytul":"Panel instytucji, konto instytucji","opis":"Dane instytucji do edycji przez akceptację LDIT (D-288) i lista pracowników instytucji, widoczna tylko dla administratora instytucji: zmiana roli i przypisanie klientów (D-318).","plik":"screeny/is-konto.jpg","obraz":"screeny/is-konto.jpg"},{"id":"is-katalog","tytul":"Panel instytucji, katalog szkoleń","opis":"Katalog szkoleń instytucji z cennikiem. Dodanie, zmiana i usunięcie szkolenia to propozycja zatwierdzana przez LDIT (D-320).","plik":"screeny/is-katalog.jpg","obraz":"screeny/is-katalog.jpg"},{"id":"is-zgloszenia","tytul":"Panel instytucji, zgłoszenia","opis":"Z lewej Od LDIT (decyzje LDIT i urzędów, przypisania terminów) z czerwonym licznikiem nieprzeczytanych, z prawej Wysłane do LDIT (Zgłoś klienta, Zmień dane instytucji, Zmień dane klienta, ze statusem) i formularze czekające na akceptację z edycją i wycofaniem do uzupełnienia. Przeczytane i Oznacz wszystkie jako przeczytane gasi licznik, dzwonek w górnym pasku prowadzi tutaj (D-353).","plik":"screeny/is-zgloszenia.jpg","obraz":"screeny/is-zgloszenia.jpg"}]},{"nazwa":"Logowanie i menu","opis":"Ekran logowania i lewe menu z latami i instytucjami.","ekrany":[{"id":"logowanie","tytul":"Ekran logowania","opis":"Logowanie z listą kont demonstracyjnych (lista tylko w makiecie).","plik":"screeny/logowanie.jpg","obraz":"screeny/logowanie.jpg"},{"id":"menu","tytul":"Lewe menu z latami i instytucjami","opis":"Menu z grupami i ikonami w nowym motywie (czcionka Inter, docs/26), Dofinansowania rozwijają lata i instytucje (D-127, D-159, D-265). Liczniki akceptacji i zgłoszeń na czerwono. Na telefonie menu jako szuflada.","plik":"screeny/menu.jpg","obraz":"screeny/menu.jpg"}]}]};
const KLUCZ = "ldit-feedback-makiety";
const OCENY = [["jasne", "Wszystko jasne"], ["drobne", "Drobne uwagi"], ["zmiany", "Wymaga zmian"], ["nie-dotyczy", "Nie dotyczy mnie"]];

/* Strony ankiety w kolejnosci: wstep, dla kazdej sekcji wstep sekcji i jej ekrany, na koncu podsumowanie. */
const strony = [{ typ: "start", id: "start" }];
DANE.sekcje.forEach((s, i) => {
  strony.push({ typ: "sekcja", id: "sekcja-" + i, sekcja: i });
  s.ekrany.forEach((e, j) => strony.push({ typ: "ekran", id: e.id, sekcja: i, ekran: j }));
});
strony.push({ typ: "koniec", id: "koniec" });

let stan = wczytajStan();
let biezaca = Math.max(0, strony.findIndex((s) => s.id === (location.hash.slice(1) || "start")));

function pustyStan() { return { respondent: "", rola: "", ekrany: {}, sekcje: {}, ogolne: "" }; }
function wczytajStan() {
  try { return Object.assign(pustyStan(), JSON.parse(localStorage.getItem(KLUCZ) || "{}")); } catch (e) { return pustyStan(); }
}
let zegarZapisu = null;
function zapiszStan() {
  try { localStorage.setItem(KLUCZ, JSON.stringify(stan)); } catch (e) { /* tryb prywatny: odpowiedzi tylko w pamieci, zostaje zapis JSON */ }
  const z = document.getElementById("zapisano");
  z.textContent = "Zapisano w przeglądarce";
  clearTimeout(zegarZapisu);
  zegarZapisu = setTimeout(() => { z.textContent = ""; }, 1800);
  odswiezMenu(); odswiezPostep();
}
const esc = (t) => String(t).replace(/[&<>"']/g, (z) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[z]));
const czyEkranWypelniony = (id) => { const o = stan.ekrany[id]; return Boolean(o && (o.ocena || (o.uwagi || "").trim())); };

function odswiezPostep() {
  const wszystkie = DANE.sekcje.reduce((n, s) => n + s.ekrany.length, 0);
  const gotowe = DANE.sekcje.reduce((n, s) => n + s.ekrany.filter((e) => czyEkranWypelniony(e.id)).length, 0);
  document.getElementById("postepTekst").textContent = "Ocenione ekrany: " + gotowe + " z " + wszystkie;
  document.getElementById("postepPasek").style.width = Math.round((gotowe / wszystkie) * 100) + "%";
}

function odswiezMenu() {
  const nav = document.getElementById("menu");
  const aktywny = strony[biezaca].id;
  let html = '<div class="logo"><b>LDIT</b><span>Feedback do makiety, wersja ' + esc(DANE.wersja) + "</span></div>";
  html += '<div class="sekcja-menu"><button type="button" data-strona="start" class="' + (aktywny === "start" ? "aktywny" : "") + '">Start</button></div>';
  DANE.sekcje.forEach((s, i) => {
    const gotowe = s.ekrany.filter((e) => czyEkranWypelniony(e.id)).length;
    html += '<div class="sekcja-menu"><button type="button" data-strona="sekcja-' + i + '" class="' + (aktywny === "sekcja-" + i ? "aktywny" : "") + '">'
      + "<span>" + esc(s.nazwa) + '</span><span class="licznik">' + gotowe + "/" + s.ekrany.length + "</span></button><ol>";
    s.ekrany.forEach((e) => {
      html += '<li><button type="button" data-strona="' + e.id + '" class="' + (aktywny === e.id ? "aktywny" : "") + '">'
        + '<span class="kropka' + (czyEkranWypelniony(e.id) ? " pelna" : "") + '"></span><span>' + esc(e.tytul) + "</span></button></li>";
    });
    html += "</ol></div>";
  });
  html += '<div class="sekcja-menu"><button type="button" data-strona="koniec" class="' + (aktywny === "koniec" ? "aktywny" : "") + '">Podsumowanie i wysyłka</button></div>';
  nav.innerHTML = html;
}

function nawigacjaHtml() {
  const poprzednia = biezaca > 0, nastepna = biezaca < strony.length - 1;
  return '<div class="nawigacja"><button class="btn" type="button" data-krok="-1"' + (poprzednia ? "" : " disabled") + ">← Wstecz</button>"
    + '<button class="btn glowny" type="button" data-krok="1"' + (nastepna ? "" : " disabled") + ">Dalej →</button></div>";
}

function stronaStart() {
  return '<section class="karta wstep"><h2>Dziękujemy za pomoc przy makiecie</h2>'
    + "<p>Przejdź po kolei przez ekrany makiety systemu KFS. Przy każdym ekranie zaznacz krótką ocenę i, jeśli chcesz, opisz, co zmienić albo czego brakuje. "
    + "Odpowiedzi zapisują się automatycznie w tej przeglądarce. Na końcu kliknij <b>Zapisz odpowiedzi (JSON)</b> i odeślij plik do Clickless.</p>"
    + '<p><label>Imię i nazwisko<br><input type="text" data-pole="respondent" value="' + esc(stan.respondent) + '"></label></p>'
    + '<p><label>Rola w LDIT (np. administrator, pracownik, instytucja)<br><input type="text" data-pole="rola" value="' + esc(stan.rola) + '"></label></p>'
    + "<p>Ekranów do oceny: " + strony.filter((s) => s.typ === "ekran").length + " w " + DANE.sekcje.length + " sekcjach. Strzałki ← → na klawiaturze przełączają ekrany.</p></section>"
    + nawigacjaHtml();
}

function stronaSekcji(i) {
  const s = DANE.sekcje[i];
  const miniatury = s.ekrany.map((e) => '<button class="miniatura" type="button" data-strona="' + e.id + '"><img loading="lazy" src="' + e.obraz + '" alt=""><span>'
    + esc(e.tytul) + "</span></button>").join("");
  return '<section class="karta"><div class="okruszek">Sekcja ' + (i + 1) + " z " + DANE.sekcje.length + "</div><h2>" + esc(s.nazwa) + "</h2>"
    + (s.opis ? '<p class="opis-ekranu">' + esc(s.opis) + "</p>" : "")
    + '<p class="podpowiedz">Ekrany w tej sekcji (kliknij, aby przejść):</p><div class="siatka">' + miniatury + "</div>"
    + '<div class="pytanie"><h3>Uwagi do całej sekcji (opcjonalnie)</h3><textarea data-sekcja="' + i + '" placeholder="Co w tej części systemu działa dobrze, a co trzeba zmienić?">'
    + esc(stan.sekcje[i] || "") + "</textarea></div></section>" + nawigacjaHtml();
}

function stronaEkranu(i, j) {
  const s = DANE.sekcje[i], e = s.ekrany[j], o = stan.ekrany[e.id] || {};
  const oceny = OCENY.map(([wartosc, etykieta]) => '<label><input type="radio" name="ocena" value="' + wartosc + '"' + (o.ocena === wartosc ? " checked" : "")
    + "><span>" + etykieta + "</span></label>").join("");
  return '<section class="karta"><div class="okruszek">' + esc(s.nazwa) + " · ekran " + (j + 1) + " z " + s.ekrany.length + "</div><h2>" + esc(e.tytul) + "</h2>"
    + (e.opis ? '<p class="opis-ekranu">' + esc(e.opis) + "</p>" : "")
    + '<img class="zrzut" src="' + e.obraz + '" alt="' + esc(e.tytul) + '" data-powieksz><p class="podpowiedz">Kliknij zrzut, aby go powiększyć.</p>'
    + '<div class="pytanie"><h3>Czy ten ekran jest dla Ciebie zrozumiały i wygodny?</h3><div class="oceny" role="radiogroup" aria-label="Ocena ekranu">' + oceny + "</div>"
    + '<h3>Co zmienić, czego brakuje, co jest niejasne?</h3><textarea data-ekran="' + e.id + '" placeholder="Np. brakuje kolumny..., ta nazwa jest myląca..., tu chcę widzieć...">'
    + esc(o.uwagi || "") + "</textarea></div></section>" + nawigacjaHtml();
}

function stronaKonca() {
  const wiersze = DANE.sekcje.map((s) => {
    const licz = (w) => s.ekrany.filter((e) => (stan.ekrany[e.id] || {}).ocena === w).length;
    return "<tr><td>" + esc(s.nazwa) + "</td><td>" + licz("jasne") + "</td><td>" + licz("drobne") + "</td><td>" + licz("zmiany") + "</td><td>"
      + s.ekrany.filter((e) => !czyEkranWypelniony(e.id)).length + "</td></tr>";
  }).join("");
  return '<section class="karta"><h2>Podsumowanie</h2><table class="podsumowanie"><thead><tr><th>Sekcja</th><th>Jasne</th><th>Drobne uwagi</th><th>Wymaga zmian</th><th>Bez odpowiedzi</th></tr></thead><tbody>'
    + wiersze + '</tbody></table><div class="pytanie"><h3>Uwagi ogólne do całego systemu</h3><textarea data-pole="ogolne" placeholder="Najważniejsze rzeczy do zmiany, priorytety, pomysły...">'
    + esc(stan.ogolne) + '</textarea></div><p><button class="btn glowny" type="button" data-akcja="zapisz">Zapisz odpowiedzi (JSON)</button></p>'
    + '<p class="podpowiedz">Plik JSON odeślij do Clickless. Odpowiedzi zostają też w tej przeglądarce, więc możesz wrócić i dokończyć później.</p></section>' + nawigacjaHtml();
}

function pokaz(indeks, przewin) {
  biezaca = Math.min(Math.max(indeks, 0), strony.length - 1);
  const s = strony[biezaca];
  history.replaceState(null, "", "#" + s.id);
  const tresc = document.getElementById("tresc");
  tresc.innerHTML = s.typ === "start" ? stronaStart() : s.typ === "sekcja" ? stronaSekcji(s.sekcja) : s.typ === "ekran" ? stronaEkranu(s.sekcja, s.ekran) : stronaKonca();
  if (przewin !== false) tresc.scrollTop = 0;
  document.getElementById("menu").classList.remove("otwarte");
  odswiezMenu(); odswiezPostep();
}

function pobierzJson() {
  const wynik = {
    dokument: "ldit-feedback-makiety", wersjaMakiety: DANE.wersja, zapisano: new Date().toISOString(),
    respondent: stan.respondent, rola: stan.rola, uwagiOgolne: stan.ogolne,
    sekcje: DANE.sekcje.map((s, i) => ({
      nazwa: s.nazwa, uwagi: stan.sekcje[i] || "",
      ekrany: s.ekrany.map((e) => ({ id: e.id, ekran: e.tytul, plik: e.plik, ocena: (stan.ekrany[e.id] || {}).ocena || null, uwagi: (stan.ekrany[e.id] || {}).uwagi || "" })),
    })),
  };
  const nazwa = "feedback-makiety-" + (stan.respondent || "anonim").toLowerCase().replace(/[^a-z0-9ąćęłńóśźż]+/gi, "-") + "-" + new Date().toISOString().slice(0, 10) + ".json";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(wynik, null, 2)], { type: "application/json" }));
  a.download = nazwa; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* Wczytanie wczesniej zapisanego pliku: tylko pola tej ankiety, reszta pliku jest ignorowana. */
function wczytajJson(tekst) {
  const d = JSON.parse(tekst);
  if (!d || d.dokument !== "ldit-feedback-makiety" || !Array.isArray(d.sekcje)) throw new Error("To nie jest plik tej ankiety.");
  const nowy = pustyStan();
  nowy.respondent = String(d.respondent || ""); nowy.rola = String(d.rola || ""); nowy.ogolne = String(d.uwagiOgolne || "");
  d.sekcje.forEach((s, i) => {
    if (s && typeof s.uwagi === "string") nowy.sekcje[i] = s.uwagi;
    (Array.isArray(s && s.ekrany) ? s.ekrany : []).forEach((e) => {
      const ocena = OCENY.some(([w]) => w === e.ocena) ? e.ocena : null;
      if (typeof e.id === "string") nowy.ekrany[e.id] = { ocena, uwagi: typeof e.uwagi === "string" ? e.uwagi : "" };
    });
  });
  stan = nowy; zapiszStan(); pokaz(biezaca);
}

document.addEventListener("click", (ev) => {
  const cel = ev.target.closest("[data-strona],[data-krok],[data-akcja],[data-powieksz]");
  if (!cel) return;
  if (cel.dataset.strona) pokaz(strony.findIndex((s) => s.id === cel.dataset.strona));
  else if (cel.dataset.krok) pokaz(biezaca + Number(cel.dataset.krok));
  else if (cel.dataset.akcja === "zapisz") pobierzJson();
  else if (cel.hasAttribute("data-powieksz")) { const lb = document.getElementById("lightbox"); lb.querySelector("img").src = cel.src; lb.classList.add("otwarty"); }
});
document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.dataset.ekran) stan.ekrany[t.dataset.ekran] = Object.assign({}, stan.ekrany[t.dataset.ekran], { uwagi: t.value });
  else if (t.dataset.sekcja) stan.sekcje[t.dataset.sekcja] = t.value;
  else if (t.dataset.pole) stan[t.dataset.pole] = t.value;
  else if (t.name === "ocena") { const id = strony[biezaca].id; stan.ekrany[id] = Object.assign({}, stan.ekrany[id], { ocena: t.value }); }
  else return;
  zapiszStan();
});
document.getElementById("zapisz").addEventListener("click", pobierzJson);
document.getElementById("wczytaj").addEventListener("click", () => document.getElementById("plik").click());
document.getElementById("plik").addEventListener("change", (ev) => {
  const plik = ev.target.files[0]; if (!plik) return;
  plik.text().then(wczytajJson).catch((e) => alert("Nie udało się wczytać pliku: " + e.message));
  ev.target.value = "";
});
document.getElementById("przyciskMenu").addEventListener("click", () => document.getElementById("menu").classList.toggle("otwarte"));
document.getElementById("lightbox").addEventListener("click", (ev) => ev.currentTarget.classList.remove("otwarty"));
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") { document.getElementById("lightbox").classList.remove("otwarty"); return; }
  if (/^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName) && document.activeElement.type !== "radio") return;
  if (ev.key === "ArrowRight") pokaz(biezaca + 1);
  if (ev.key === "ArrowLeft") pokaz(biezaca - 1);
});
pokaz(biezaca);
</script>
</body>
</html>
