<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moje konto</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/style-sesja.css">
<link rel="stylesheet" href="../assets/style-interfejs.css">
<style>
  .konto-uklad { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  .haslo-form .field input { width: 100%; max-width: 360px; }
  .haslo-form .blad { color: var(--neg-ink); font-size: 0.8125rem; margin-top: 4px; }
  .haslo-form input[aria-invalid="true"] { border-color: var(--neg-ink); }
  @media (max-width: 700px) { .konto-uklad { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<div class="page">

  <div class="page-head">
    <div class="ph-text">
      <h1 class="page-title">Moje konto</h1>
      <p class="page-desc">Dane Twojego konta i zmiana hasła.</p>
    </div>
  </div>

  <div class="konto-uklad">
    <div class="card">
      <div class="card-head"><h3>Dane konta</h3></div>
      <div class="card-body"><dl class="dl" id="daneKonta23"></dl></div>
    </div>

    <div class="card">
      <div class="card-head"><h3>Zmiana hasła</h3></div>
      <div class="card-body">
        <form class="haslo-form" id="formHasla23" novalidate>
          <input type="text" name="username" id="login23" autocomplete="username" hidden>
          <div class="field">
            <label for="obecne23">Obecne hasło</label>
            <input class="inp" type="password" id="obecne23" name="obecne" autocomplete="current-password" aria-describedby="bladObecne23">
            <div class="blad" id="bladObecne23"></div>
          </div>
          <div class="field">
            <label for="nowe23">Nowe hasło</label>
            <input class="inp" type="password" id="nowe23" name="nowe" autocomplete="new-password" aria-describedby="politykaHasla23 bladNowe23">
            <div class="hint" id="politykaHasla23"></div>
            <div class="blad" id="bladNowe23"></div>
          </div>
          <div class="field">
            <label for="powtorzone23">Powtórz nowe hasło</label>
            <input class="inp" type="password" id="powtorzone23" name="powtorzone" autocomplete="new-password" aria-describedby="bladPowtorzone23">
            <div class="blad" id="bladPowtorzone23"></div>
          </div>
          <div class="btn-row"><button class="btn primary sm" type="submit">Zmień hasło</button></div>
          <div class="small" id="komunikat23" role="status" style="margin-top:8px"></div>
          <p class="small muted" style="margin:10px 0 0">Po zmianie hasła wylogujemy Cię na innych urządzeniach. W makiecie zmiana dotyczy tej przeglądarki.</p>
        </form>
      </div>
    </div>
  </div>

</div>
