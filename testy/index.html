<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista kontrolna testów LDIT</title>
<style>
:root { --granat: #222344; --granat-2: #2f3160; --zloto: #cdad7d; --zloto-tlo: #f6f0e6; --tlo: #f4f5f9; --karta: #fff;
  --tekst: #1f2133; --szary: #6b6f87; --linia: #e3e5ee; --ok: #18a558; --uwaga: #c98a12; --zle: #e84040; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: Inter, "Segoe UI", system-ui, sans-serif; font-size: 14px; color: var(--tekst); background: var(--tlo); }
button, textarea, input { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
.menu { background: var(--granat); color: #e8e9f3; overflow-y: auto; padding: 16px 0 24px; }
.logo { padding: 0 20px 14px; border-bottom: 1px solid rgba(255,255,255,.1); margin-bottom: 8px; }
.logo b { color: var(--zloto); font-size: 18px; letter-spacing: .5px; }
.logo span { display: block; font-size: 12px; opacity: .7; margin-top: 2px; }
.menu button { width: 100%; text-align: left; background: none; border: 0; padding: 9px 20px; cursor: pointer;
  font-weight: 600; color: #fff; display: flex; justify-content: space-between; gap: 8px; }
.menu button:hover { background: var(--granat-2); }
.menu .licznik { font-size: 11px; font-weight: 500; opacity: .75; white-space: nowrap; }
.menu .pusto { padding: 9px 20px; font-size: 12px; opacity: .7; line-height: 1.5; }
.aktywny { background: var(--granat-2) !important; box-shadow: inset 3px 0 0 var(--zloto); }
.glowna { display: flex; flex-direction: column; min-width: 0; }
.pasek { display: flex; align-items: center; gap: 14px; padding: 10px 24px; background: var(--karta); border-bottom: 1px solid var(--linia); flex-wrap: wrap; }
.pasek h1 { font-size: 16px; margin: 0; }
.postep { flex: 1; min-width: 180px; }
.postep small { color: var(--szary); }
.postep .tor { height: 6px; background: var(--linia); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.postep .tor div { height: 100%; background: var(--zloto); width: 0; transition: width .3s; }
.btn { border: 1px solid var(--linia); background: var(--karta); border-radius: 8px; padding: 7px 14px; cursor: pointer; }
.btn:hover { border-color: var(--granat); }
.btn.glowny { background: var(--granat); color: #fff; border-color: var(--granat); }
.btn.glowny:hover { background: var(--granat-2); }
.btn:disabled { opacity: .4; cursor: default; }
.tresc { flex: 1; overflow-y: auto; padding: 24px; }
.karta { background: var(--karta); border: 1px solid var(--linia); border-radius: 12px; padding: 22px; max-width: 980px; margin: 0 auto 18px; }
.okruszek { color: var(--szary); font-size: 12px; margin-bottom: 6px; }
.karta h2 { margin: 0 0 14px; font-size: 20px; }
.opis-sekcji { margin: -6px 0 6px; color: var(--szary); max-width: 760px; line-height: 1.5; }
.wstep p, .wstep li { line-height: 1.6; max-width: 760px; }
.wstep ul { padding-left: 20px; }
.przypomnienie { max-width: 980px; margin: 0 auto 14px; background: var(--zloto-tlo); border: 1px solid var(--zloto); border-radius: 10px; padding: 10px 14px; line-height: 1.5; }
.zapisano { color: var(--ok); font-size: 12px; min-width: 120px; }
.kto { color: var(--szary); font-size: 12px; }
textarea { width: 100%; min-height: 70px; border: 1px solid var(--linia); border-radius: 8px; padding: 10px 12px; resize: vertical; }
textarea:focus, input[type=text]:focus { outline: 2px solid var(--zloto); border-color: var(--granat); }
input[type=text] { border: 1px solid var(--linia); border-radius: 8px; padding: 8px 12px; width: 100%; max-width: 420px; }
.sciezki { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin: 10px 0 16px; }
.sciezka { border: 1px solid var(--linia); border-radius: 10px; padding: 12px 14px; cursor: pointer; display: block; background: var(--karta); }
.sciezka input { position: absolute; opacity: 0; pointer-events: none; }
.sciezka b { display: block; margin-bottom: 4px; }
.sciezka span { color: var(--szary); font-size: 13px; line-height: 1.45; display: block; }
.sciezka:has(input:checked) { border-color: var(--granat); background: var(--zloto-tlo); box-shadow: inset 0 0 0 1px var(--granat); }
.sciezka:has(input:focus-visible) { outline: 2px solid var(--zloto); }
.krok { border: 1px solid var(--linia); border-left: 5px solid var(--linia); border-radius: 10px; padding: 14px 16px; margin: 14px 0; background: var(--karta); }
.krok-dziala { border-left-color: var(--ok); }
.krok-nie-dziala { border-left-color: var(--zle); }
.krok-uwagi { border-left-color: var(--uwaga); }
.krok-gora { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.krok-gora h3 { margin: 0; font-size: 15px; }
.numer { color: var(--szary); font-size: 12px; font-variant-numeric: tabular-nums; }
.znacznik { font-size: 11px; color: var(--szary); border: 1px solid var(--linia); border-radius: 10px; padding: 1px 8px; }
.krok h4 { margin: 12px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--szary); }
.krok ol { margin: 0; padding-left: 20px; line-height: 1.55; }
.krok p { margin: 0; line-height: 1.55; }
.oczekiwany p { background: #f8f9fc; border-radius: 8px; padding: 8px 12px; }
.oceny { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 10px; }
.ocena { border: 1px solid var(--linia); background: var(--karta); border-radius: 20px; padding: 7px 18px; cursor: pointer; min-height: 38px; }
.ocena:hover { border-color: var(--granat); }
.ocena-dziala.wybrana { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 600; }
.ocena-nie-dziala.wybrana { background: var(--zle); border-color: var(--zle); color: #fff; font-weight: 600; }
.ocena-uwagi.wybrana { background: var(--uwaga); border-color: var(--uwaga); color: #fff; font-weight: 600; }
.blokada { color: var(--zle); font-size: 13px; margin: 0 0 8px; }
.nawigacja { display: flex; justify-content: space-between; gap: 10px; max-width: 980px; margin: 0 auto; }
.podsumowanie { border-collapse: collapse; width: 100%; }
.podsumowanie td, .podsumowanie th { padding: 6px 12px; border-bottom: 1px solid var(--linia); text-align: left; }
.problem { border-bottom: 1px solid var(--linia); padding: 8px 0; line-height: 1.5; }
.problem small { color: var(--szary); }
.podpowiedz { color: var(--szary); font-size: 12px; margin: 6px 0 0; }
.pytanie h3 { margin: 18px 0 8px; font-size: 15px; }
.tylko-telefon { display: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; height: auto; min-height: 100vh; }
  .menu { display: none; }
  .menu.otwarte { display: block; position: fixed; inset: 0; z-index: 40; }
  .tylko-telefon { display: inline-block; }
  .pasek { padding: 10px 14px; gap: 8px; }
  .tresc { padding: 14px; overflow: visible; }
  .karta { padding: 16px; }
  .krok { padding: 12px; }
  .ocena { flex: 1 1 30%; text-align: center; padding: 9px 8px; }
  .podsumowanie { display: block; overflow-x: auto; }
}
</style>
</head>
<body>
<div class="app">
  <nav class="menu" id="menu" aria-label="Części listy kontrolnej"></nav>
  <div class="glowna">
    <header class="pasek">
      <button class="btn tylko-telefon" id="przyciskMenu" type="button">Menu</button>
      <h1>Lista kontrolna testów LDIT</h1>
      <div class="postep"><small id="postepTekst"></small><div class="tor"><div id="postepPasek"></div></div></div>
      <span class="kto" id="kto"></span>
      <span class="zapisano" id="zapisano" aria-live="polite"></span>
      <button class="btn" id="wczytaj" type="button">Wczytaj JSON</button>
      <button class="btn glowny" id="zapisz" type="button">Zapisz odpowiedzi (JSON)</button>
      <input type="file" id="plik" accept="application/json,.json" hidden>
    </header>
    <main class="tresc" id="tresc" tabindex="-1"></main>
  </div>
</div>

<script id="inicjalizacja">
"use strict";
const DANE = JSON.parse(document.getElementById("dane").textContent);
</script>
<script id="logika">
"use strict";
/* Logika bez dostepu do DOM: opisy krokow, stan, eksport i import JSON. */
const WYNIKI = [["dziala", "Działa"], ["nie-dziala", "Nie działa"], ["uwagi", "Uwagi"]];
const DOKUMENT = "ldit-lista-testow";

const esc = (t) => String(t).replace(/[&<>"']/g, (z) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[z]));
const znajdzSciezke = (id) => DANE.sciezki.find((s) => s.id === id) || null;
const krokiSciezki = (idSciezki) => DANE.kroki.filter((k) => k.sciezki.includes(idSciezki));

function sekcjeSciezki(idSciezki) {
  const kroki = krokiSciezki(idSciezki);
  return DANE.sekcje
    .map((s) => Object.assign({}, s, { kroki: kroki.filter((k) => k.sekcja === s.id) }))
    .filter((s) => s.kroki.length > 0);
}

function pustyStan() { return { tester: "", sciezka: "", odpowiedzi: {}, ogolne: "" }; }

function odczytajOdpowiedz(stan, idSciezki, idKroku) {
  const o = (stan.odpowiedzi[idSciezki] || {})[idKroku];
  return { wynik: o && o.wynik ? o.wynik : null, komentarz: o && o.komentarz ? o.komentarz : "" };
}

function zapiszOdpowiedz(stan, idSciezki, idKroku, zmiana) {
  if (!stan.odpowiedzi[idSciezki]) stan.odpowiedzi[idSciezki] = {};
  stan.odpowiedzi[idSciezki][idKroku] = Object.assign(odczytajOdpowiedz(stan, idSciezki, idKroku), zmiana);
}

function tekstKroku(krok, idSciezki) {
  return Object.assign({ instrukcja: krok.instrukcja, oczekiwany: krok.oczekiwany }, (krok.warianty || {})[idSciezki]);
}

function krokHtml(krok, numer, odp, idSciezki) {
  const t = tekstKroku(krok, idSciezki);
  const lista = t.instrukcja.map((l) => "<li>" + esc(l) + "</li>").join("");
  const przyciski = WYNIKI.map(([w, etykieta]) => '<button type="button" class="ocena ocena-' + w + (odp.wynik === w ? " wybrana" : "")
    + '" data-krok="' + esc(krok.id) + '" data-wynik="' + w + '" aria-pressed="' + (odp.wynik === w) + '">' + etykieta + "</button>").join("");
  return '<article class="krok' + (odp.wynik ? " krok-" + odp.wynik : "") + '" id="krok-' + esc(krok.id) + '">'
    + '<header class="krok-gora"><span class="numer">' + esc(numer) + "</span><h3>" + esc(krok.tytul) + "</h3>"
    + (krok.opcjonalny ? '<span class="znacznik">opcjonalny</span>' : "") + "</header>"
    + '<div class="co"><h4>Co zrobić</h4><ol>' + lista + "</ol></div>"
    + '<div class="oczekiwany"><h4>Oczekiwany wynik</h4><p>' + esc(t.oczekiwany) + "</p></div>"
    + '<div class="oceny" role="group" aria-label="Wynik kroku">' + przyciski + "</div>"
    + (odp.wynik === "nie-dziala" ? '<p class="blokada">Jeśli błąd uniemożliwia dalszą pracę, zgłoś go też od razu w aplikacji, w module Zgłoszenia.</p>' : "")
    + '<textarea data-komentarz="' + esc(krok.id) + '" aria-label="Komentarz do kroku: ' + esc(krok.tytul)
    + '" placeholder="Komentarz: co zobaczyłeś, na którym ekranie, na jakim koncie">' + esc(odp.komentarz) + "</textarea></article>";
}

function podsumuj(stan, idSciezki) {
  const kroki = krokiSciezki(idSciezki);
  const licz = (w) => kroki.filter((k) => odczytajOdpowiedz(stan, idSciezki, k.id).wynik === w).length;
  const wynik = { razem: kroki.length, dziala: licz("dziala"), nieDziala: licz("nie-dziala"), uwagi: licz("uwagi") };
  wynik.bezOdpowiedzi = wynik.razem - wynik.dziala - wynik.nieDziala - wynik.uwagi;
  return wynik;
}

function listaProblemow(stan, idSciezki) {
  return sekcjeSciezki(idSciezki).flatMap((s) => s.kroki.map((k) => ({ sekcja: s.nazwa, krok: k, odp: odczytajOdpowiedz(stan, idSciezki, k.id) })))
    .filter((p) => p.odp.wynik === "nie-dziala" || p.odp.wynik === "uwagi");
}

function dataLokalna(d) {
  const dwie = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + dwie(d.getMonth() + 1) + "-" + dwie(d.getDate());
}

function nazwaPliku(stan, teraz) {
  const nazwisko = (stan.tester || "anonim").toLowerCase().replace(/[^a-z0-9ąćęłńóśźż]+/g, "-").replace(/^-+|-+$/g, "") || "anonim";
  return "lista-testow-" + nazwisko + "-" + stan.sciezka + "-" + dataLokalna(teraz) + ".json";
}

function zbudujEksport(stan, idSciezki, teraz) {
  const kroki = sekcjeSciezki(idSciezki).flatMap((s) => s.kroki.map((k) => {
    const o = odczytajOdpowiedz(stan, idSciezki, k.id);
    return { id: k.id, sekcja: s.nazwa, krok: k.tytul, opcjonalny: Boolean(k.opcjonalny), wynik: o.wynik, komentarz: o.komentarz };
  }));
  return {
    dokument: DOKUMENT, wersja: DANE.wersja, tester: stan.tester.trim(), sciezka: idSciezki, sciezkaNazwa: znajdzSciezke(idSciezki).nazwa,
    data: dataLokalna(teraz), zapisano: teraz.toISOString(), uwagiOgolne: stan.ogolne, podsumowanie: podsumuj(stan, idSciezki), kroki,
  };
}

/* Wczytanie wczesniej wyeksportowanego pliku: tylko znane kroki wybranej sciezki, reszta pliku jest ignorowana. */
function wczytajEksport(tekst, stan) {
  const d = JSON.parse(tekst);
  if (!d || d.dokument !== DOKUMENT || !Array.isArray(d.kroki) || !znajdzSciezke(d.sciezka)) throw new Error("To nie jest plik tej listy kontrolnej.");
  const znane = new Set(krokiSciezki(d.sciezka).map((k) => k.id));
  const odpowiedzi = {};
  d.kroki.filter((k) => k && znane.has(k.id)).forEach((k) => {
    odpowiedzi[k.id] = { wynik: WYNIKI.some(([w]) => w === k.wynik) ? k.wynik : null, komentarz: typeof k.komentarz === "string" ? k.komentarz : "" };
  });
  return Object.assign({}, stan, {
    tester: String(d.tester || ""), sciezka: d.sciezka, ogolne: String(d.uwagiOgolne || ""),
    odpowiedzi: Object.assign({}, stan.odpowiedzi, { [d.sciezka]: odpowiedzi }),
  });
}
</script>
<script id="aplikacja">
"use strict";
const KLUCZ = "ldit-lista-testow";
const PRZYPOMNIENIE = "Błąd blokujący, po którym nie da się pracować dalej, zgłoś od razu w aplikacji, w module Zgłoszenia. Tu zaznacz Nie działa i dopisz krótki komentarz.";

let stan = wczytajStan();
let biezacaId = location.hash.slice(1) || "start";

function wczytajStan() {
  let zapisany = {};
  try { zapisany = JSON.parse(localStorage.getItem(KLUCZ) || "{}"); } catch (e) { zapisany = {}; }
  const nowy = Object.assign(pustyStan(), zapisany);
  if (!znajdzSciezke(nowy.sciezka)) nowy.sciezka = "";
  return nowy;
}

let zegarZapisu = null;
function zapiszStan() {
  const z = document.getElementById("zapisano");
  try {
    localStorage.setItem(KLUCZ, JSON.stringify(stan));
    z.textContent = "Zapisano w przeglądarce";
  } catch (e) {
    z.textContent = "Brak autozapisu, zapisz plik JSON";
  }
  clearTimeout(zegarZapisu);
  zegarZapisu = setTimeout(() => { z.textContent = ""; }, 2200);
  odswiezMenu(); odswiezPostep();
}

function strony() {
  const lista = [{ id: "start", typ: "start" }];
  if (!stan.sciezka) return lista;
  sekcjeSciezki(stan.sciezka).forEach((s, i) => lista.push({ id: "sekcja-" + s.id, typ: "sekcja", sekcja: s, numer: i + 1 }));
  lista.push({ id: "koniec", typ: "koniec" });
  return lista;
}

function odpowiedziSekcji(sekcja) {
  return sekcja.kroki.filter((k) => odczytajOdpowiedz(stan, stan.sciezka, k.id).wynik).length;
}

function odswiezPostep() {
  const tekst = document.getElementById("postepTekst");
  const kto = document.getElementById("kto");
  const sciezka = znajdzSciezke(stan.sciezka);
  kto.textContent = sciezka ? (stan.tester.trim() ? stan.tester.trim() + ", " : "") + sciezka.nazwa : "";
  if (!sciezka) { tekst.textContent = "Wybierz ścieżkę na stronie Start"; document.getElementById("postepPasek").style.width = "0"; return; }
  const p = podsumuj(stan, stan.sciezka);
  const gotowe = p.razem - p.bezOdpowiedzi;
  tekst.textContent = "Ocenione kroki: " + gotowe + " z " + p.razem;
  document.getElementById("postepPasek").style.width = Math.round((gotowe / p.razem) * 100) + "%";
}

function odswiezMenu() {
  const lista = strony();
  const przycisk = (s, etykieta, licznik) => '<button type="button" data-strona="' + s.id + '" class="' + (biezacaId === s.id ? "aktywny" : "") + '"><span>'
    + esc(etykieta) + "</span>" + (licznik ? '<span class="licznik">' + licznik + "</span>" : "") + "</button>";
  const sciezka = znajdzSciezke(stan.sciezka);
  let html = '<div class="logo"><b>LDIT</b><span>Lista kontrolna testów, wersja ' + esc(DANE.wersja) + "</span></div>";
  html += lista.map((s) => {
    if (s.typ === "start") return przycisk(s, "Start i wybór ścieżki", "");
    if (s.typ === "koniec") return przycisk(s, "Podsumowanie i eksport", "");
    return przycisk(s, s.numer + ". " + s.sekcja.nazwa, odpowiedziSekcji(s.sekcja) + "/" + s.sekcja.kroki.length);
  }).join("");
  if (!sciezka) html += '<p class="pusto">Po wyborze ścieżki pojawią się tu części listy.</p>';
  document.getElementById("menu").innerHTML = html;
}

function nawigacjaHtml(indeks, wszystkie) {
  return '<div class="nawigacja"><button class="btn" type="button" data-krok-nawigacja="-1"' + (indeks > 0 ? "" : " disabled") + ">← Wstecz</button>"
    + '<button class="btn glowny" type="button" data-krok-nawigacja="1"' + (indeks < wszystkie - 1 ? "" : " disabled") + ">Dalej →</button></div>";
}

function stronaStart() {
  const karty = DANE.sciezki.map((s) => '<label class="sciezka"><input type="radio" name="sciezka" value="' + s.id + '"' + (stan.sciezka === s.id ? " checked" : "")
    + "><b>" + esc(s.nazwa) + "</b><span>" + esc(s.opis) + "</span><span>Czas: " + esc(s.czas) + ".</span></label>").join("");
  return '<section class="karta wstep"><h2>Lista kontrolna testów systemu LDIT</h2>'
    + "<p>Dziękujemy za pomoc w testach. Wpisz imię i nazwisko, wybierz ścieżkę zgodną z Twoim kontem i przejdź po krokach. Cała lista to 30-40 minut. Kroki oznaczone jako opcjonalne możesz pominąć, jeśli brakuje Ci czasu.</p>"
    + '<p><label>Imię i nazwisko testera<br><input type="text" data-pole="tester" autocomplete="name" value="' + esc(stan.tester) + '"></label></p>'
    + '<h3>Ścieżka</h3><div class="sciezki" role="radiogroup" aria-label="Ścieżka testów">' + karty + "</div>"
    + "<ul>"
    + "<li>Przy każdym kroku zaznacz <b>Działa</b>, <b>Nie działa</b> albo <b>Uwagi</b> (działa, ale coś jest niejasne lub niewygodne) i dopisz komentarz: na którym ekranie, na jakim koncie, co zobaczyłeś.</li>"
    + "<li>Odpowiedzi zapisują się automatycznie w tej przeglądarce. Na końcu kliknij <b>Zapisz odpowiedzi (JSON)</b> i odeślij plik do Clickless. <b>Wczytaj JSON</b> przywraca wcześniejszy zapis, także na innym komputerze.</li>"
    + "<li>" + esc(PRZYPOMNIENIE) + "</li>"
    + "<li>Dane testowe są fikcyjne (nazwy z dopiskiem TEST, NIP z prefiksem 999). Nie wpisuj prawdziwych danych osobowych. Loginu i hasła do konta testowego ta strona nie zawiera, dostajesz je osobno.</li>"
    + "</ul>" + (stan.sciezka ? '<p><button class="btn glowny" type="button" data-krok-nawigacja="1">Zacznij testy →</button></p>' : "") + "</section>";
}

function stronaSekcji(strona, indeks, wszystkie) {
  const s = strona.sekcja;
  const kroki = s.kroki.map((k, j) => krokHtml(k, strona.numer + "." + (j + 1), odczytajOdpowiedz(stan, stan.sciezka, k.id), stan.sciezka)).join("");
  return '<div class="przypomnienie">' + esc(PRZYPOMNIENIE) + "</div>"
    + '<section class="karta"><div class="okruszek">Część ' + strona.numer + " z " + (wszystkie - 2) + "</div><h2>" + esc(s.nazwa) + "</h2>"
    + (s.opis ? '<p class="opis-sekcji">' + esc(s.opis) + "</p>" : "") + kroki + "</section>" + nawigacjaHtml(indeks, wszystkie);
}

function stronaKonca(indeks, wszystkie) {
  const wiersze = sekcjeSciezki(stan.sciezka).map((s) => {
    const licz = (w) => s.kroki.filter((k) => odczytajOdpowiedz(stan, stan.sciezka, k.id).wynik === w).length;
    return "<tr><td>" + esc(s.nazwa) + "</td><td>" + licz("dziala") + "</td><td>" + licz("nie-dziala") + "</td><td>" + licz("uwagi") + "</td><td>"
      + (s.kroki.length - odpowiedziSekcji(s)) + "</td></tr>";
  }).join("");
  const problemy = listaProblemow(stan, stan.sciezka).map((p) => '<div class="problem"><b>' + esc(p.krok.tytul) + "</b> <small>(" + esc(p.sekcja) + ", "
    + (p.odp.wynik === "nie-dziala" ? "Nie działa" : "Uwagi") + ")</small><br>" + (p.odp.komentarz.trim() ? esc(p.odp.komentarz) : "<small>bez komentarza</small>") + "</div>").join("");
  return '<section class="karta"><h2>Podsumowanie</h2><table class="podsumowanie"><thead><tr><th>Część</th><th>Działa</th><th>Nie działa</th><th>Uwagi</th><th>Bez odpowiedzi</th></tr></thead><tbody>'
    + wiersze + "</tbody></table>"
    + '<div class="pytanie"><h3>Do sprawdzenia przy wysyłce: Nie działa i Uwagi</h3>' + (problemy || '<p class="podpowiedz">Brak zgłoszonych problemów.</p>') + "</div>"
    + '<div class="pytanie"><h3>Uwagi ogólne</h3><textarea data-pole="ogolne" placeholder="Co działa dobrze, co przeszkadza, czego brakuje w całym systemie?">' + esc(stan.ogolne) + "</textarea></div>"
    + '<p><button class="btn glowny" type="button" data-akcja="zapisz">Zapisz odpowiedzi (JSON)</button></p>'
    + '<p class="podpowiedz">' + esc(PRZYPOMNIENIE) + " Plik JSON odeślij do Clickless. Odpowiedzi zostają też w tej przeglądarce, więc możesz wrócić i dokończyć później.</p></section>"
    + nawigacjaHtml(indeks, wszystkie);
}

function pokaz(id, przewin) {
  const lista = strony();
  const indeks = Math.max(0, lista.findIndex((s) => s.id === id));
  const strona = lista[indeks];
  biezacaId = strona.id;
  history.replaceState(null, "", "#" + strona.id);
  const tresc = document.getElementById("tresc");
  tresc.innerHTML = strona.typ === "start" ? stronaStart() : strona.typ === "sekcja" ? stronaSekcji(strona, indeks, lista.length) : stronaKonca(indeks, lista.length);
  if (przewin !== false) tresc.scrollTop = 0;
  if (przewin !== false) window.scrollTo(0, 0);
  document.getElementById("menu").classList.remove("otwarte");
  odswiezMenu(); odswiezPostep();
}

function przejdzO(delta) {
  const lista = strony();
  const indeks = lista.findIndex((s) => s.id === biezacaId);
  pokaz(lista[Math.min(Math.max(indeks + delta, 0), lista.length - 1)].id);
}

function odswiezKrok(idKroku, aktywnyWynik) {
  const krok = DANE.kroki.find((k) => k.id === idKroku);
  const el = document.getElementById("krok-" + idKroku);
  el.outerHTML = krokHtml(krok, el.querySelector(".numer").textContent, odczytajOdpowiedz(stan, stan.sciezka, idKroku), stan.sciezka);
  const nowy = document.getElementById("krok-" + idKroku);
  const cel = aktywnyWynik === "uwagi" ? nowy.querySelector("textarea") : nowy.querySelector('[data-wynik="' + aktywnyWynik + '"]');
  if (cel) cel.focus();
}

function obsluzWynik(przycisk) {
  const idKroku = przycisk.dataset.krok;
  const wybrany = przycisk.dataset.wynik;
  const obecny = odczytajOdpowiedz(stan, stan.sciezka, idKroku).wynik;
  zapiszOdpowiedz(stan, stan.sciezka, idKroku, { wynik: obecny === wybrany ? null : wybrany });
  odswiezKrok(idKroku, wybrany);
  zapiszStan();
}

function pobierzJson() {
  if (!stan.tester.trim() || !stan.sciezka) {
    alert("Zanim zapiszesz odpowiedzi, wpisz imię i nazwisko oraz wybierz ścieżkę na stronie Start.");
    pokaz("start");
    return;
  }
  const teraz = new Date();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(zbudujEksport(stan, stan.sciezka, teraz), null, 2)], { type: "application/json" }));
  a.download = nazwaPliku(stan, teraz);
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

document.addEventListener("click", (ev) => {
  const cel = ev.target.closest("[data-strona],[data-krok-nawigacja],[data-akcja],[data-wynik]");
  if (!cel) return;
  if (cel.dataset.strona) pokaz(cel.dataset.strona);
  else if (cel.dataset.krokNawigacja) przejdzO(Number(cel.dataset.krokNawigacja));
  else if (cel.dataset.akcja === "zapisz") pobierzJson();
  else if (cel.dataset.wynik) obsluzWynik(cel);
});
document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.dataset.komentarz) zapiszOdpowiedz(stan, stan.sciezka, t.dataset.komentarz, { komentarz: t.value });
  else if (t.dataset.pole) stan[t.dataset.pole] = t.value;
  else if (t.name === "sciezka") { stan.sciezka = t.value; zapiszStan(); pokaz("start", false); return; }
  else return;
  zapiszStan();
});
document.getElementById("zapisz").addEventListener("click", pobierzJson);
document.getElementById("wczytaj").addEventListener("click", () => document.getElementById("plik").click());
document.getElementById("plik").addEventListener("change", (ev) => {
  const plik = ev.target.files[0];
  if (!plik) return;
  plik.text()
    .then((tekst) => { stan = wczytajEksport(tekst, stan); zapiszStan(); pokaz(biezacaId); })
    .catch((e) => alert("Nie udało się wczytać pliku: " + e.message));
  ev.target.value = "";
});
document.getElementById("przyciskMenu").addEventListener("click", () => document.getElementById("menu").classList.toggle("otwarte"));
pokaz(biezacaId);
</script>
</body>
</html>
